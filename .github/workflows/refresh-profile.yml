name: Refresh profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.json
      - profile.config.schema.json
      - scripts/**
      - .github/workflows/refresh-profile.yml

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build README and cards
        run: node scripts/build-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read snake settings from config
        id: snake
        run: |
          node -e '
            const { username, snake } = require("./profile.config.json");
            const dots = (colors) => colors.map((c) => "#" + c).join(",");
            const lines = [
              `user=${username}`,
              "outputs<<EOF",
              `dist/snake-light.svg?color_snake=#${snake.colorSnake}&color_dots=${dots(snake.dotsLight)}`,
              `dist/snake-dark.svg?palette=github-dark&color_snake=#${snake.colorSnake}&color_dots=${dots(snake.dotsDark)}`,
              "EOF",
            ];
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
          '

      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ steps.snake.outputs.user }}
          outputs: ${{ steps.snake.outputs.outputs }}

      - name: Publish cards to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: Refresh profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit README if it changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh profile README"
          git push
